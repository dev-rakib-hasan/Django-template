
<!DOCTYPE html>
<html>
<head>
    <title>Create Blog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101519;
            color: #e5edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #1c242b;
            padding: 35px;
            border: 1px solid #303e49;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: #39c2fa;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 23px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #70d2ff;
            font-size: 16px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            background: #252f38;
            color: #eaf6ff;
            border: 1px solid #405361;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #899aa8;
        }

        input:focus,
        textarea:focus {
            border-color: #35bdf2;
            background: #202e39;
            box-shadow: 0 0 10px rgba(53,189,242,0.25);
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #36c4f5, #249fe0);
            color: #071923;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #65d6ff, #35bdf2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(53,189,242,0.25);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #45c7fa;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>✨ Create New Blog</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Blog Title</label>
                <input
                    type="text"
                    name="title"
                    placeholder="Enter your blog title..."
                    required
                >
            </div>

            <div class="form-group">
                <label>Blog Description</label>
                <textarea
                    name="description"
                    placeholder="Write your blog description here..."
                    required
                ></textarea>
            </div>

            <button type="submit">+ Create Blog</button>

        </form>

        <a href="{% url 'blog_list' %}" class="back-link">
            ← Back to Blog List
        </a>

    </div>

</body>
</html>
