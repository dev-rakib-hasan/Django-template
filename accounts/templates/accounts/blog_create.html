
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create New Blog</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(ellipse at top left, rgba(30,64,100,.4), transparent 45%),
                radial-gradient(ellipse at bottom right, rgba(88,45,120,.25), transparent 45%),
                linear-gradient(135deg, #080d16, #111827, #101418, #171426);
            background-attachment: fixed;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #1b2229;
            padding: 35px;
            border-radius: 13px;
            border: 1px solid #344354;
            border-top: 4px solid #38bdf8;
            box-shadow: 0 10px 35px rgba(0,0,0,.3);
        }

        h2 {
            text-align: center;
            color: #7dd3fc;
            margin-bottom: 30px;
            font-size: 27px;
        }

        .form-group {
            margin-bottom: 23px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #e2e8f0;
            margin-bottom: 10px;
            font-size: 15px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #475569;
            border-radius: 8px;
            outline: none;
            background: #101820;
            color: #f1f5f9;
            font-size: 15px;
            font-family: Arial, sans-serif;
            transition: .3s;
        }

        input[type="text"] {
            height: 48px;
        }

        textarea {
            height: 155px;
            resize: vertical;
            line-height: 1.6;
        }

        input:focus,
        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56,189,248,.15);
        }

        input::placeholder,
        textarea::placeholder {
            color: #64748b;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #101418;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .submit-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56,189,248,.15);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #7dd3fc;
            text-decoration: none;
            font-weight: bold;
            transition: .3s;
        }

        .back-link:hover {
            color: #c4b5fd;
        }

        .error-message {
            color: #fca5a5;
            margin-bottom: 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>✨ Create New Blog</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="error-message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        {% if form.errors %}
            <div class="error-message">
                {{ form.errors }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'create_blog' %}">
            {% csrf_token %}

            <div class="form-group">

                <label for="title">Blog Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter your blog title..."
                    value="{{ request.POST.title|default:'' }}"
                    maxlength="200"
                    required
                >

            </div>

            <div class="form-group">

                <label for="description">Blog Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Write your blog description here..."
                    required
                >{{ request.POST.description|default:'' }}</textarea>

            </div>

            <button type="submit" class="submit-btn">
                Create Blog
            </button>

        </form>

        <a href="{% url 'blog_list' %}" class="back-link">
            ← Back to Blog List
        </a>

    </div>

</body>
</html>
