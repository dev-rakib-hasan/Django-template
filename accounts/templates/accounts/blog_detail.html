
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(ellipse at top left, rgba(30,64,100,.4), transparent 45%),
                radial-gradient(ellipse at bottom right, rgba(88,45,120,.25), transparent 45%),
                linear-gradient(135deg, #080d16, #111827, #101418, #171426);
            background-attachment: fixed;
            color: #e5e7eb;
            min-height: 100vh;
            padding: 35px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: #1b2229;
            padding: 30px;
            border-radius: 13px;
            border: 1px solid #344354;
            box-shadow: 0 10px 35px rgba(0,0,0,.3);
        }

        h2 {
            text-align: center;
            color: #7dd3fc;
            margin-bottom: 22px;
        }

        .blog-box {
            background: #111b27;
            padding: 22px;
            border-radius: 10px;
            border-left: 4px solid #38bdf8;
            margin-bottom: 30px;
        }

        .blog-box h3 {
            color: #7dd3fc;
            margin-bottom: 14px;
            font-size: 23px;
        }

        .blog-box p {
            color: #cbd5e1;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .form-section {
            background: #222b36;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #384656;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #e2e8f0;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #101820;
            color: white;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
        }

        input {
            height: 47px;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56,189,248,.15);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        .update-btn {
            background: #38bdf8;
            color: #101418;
        }

        .update-btn:hover {
            background: #7dd3fc;
        }

        .delete-section {
            background: #241c28;
            border: 1px solid #51303e;
            padding: 23px;
            border-radius: 10px;
            text-align: center;
        }

        .delete-section h2 {
            color: #fda4af;
        }

        .delete-btn {
            background: #334155;
            color: #fda4af;
            border: 1px solid #64748b;
        }

        .delete-btn:hover {
            background: #9f1239;
            color: white;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #7dd3fc;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            color: white;
        }

        @media(max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Blog Details</h2>

        <div class="blog-box">
            <h3>{{ blog.title }}</h3>
            <p>{{ blog.description }}</p>
        </div>

        <div class="form-section">

            <h2>Update Blog</h2>

            <form method="POST" action="{% url 'blog_update' blog.pk %}">
                {% csrf_token %}

                <label>Title:</label>
                <input type="text" name="title"
                       value="{{ blog.title }}" required>

                <label>Description:</label>
                <textarea name="description" required>{{ blog.description }}</textarea>

                <button type="submit" class="update-btn">
                    Update Blog
                </button>
            </form>

        </div>

        <div class="delete-section">

            <h2>Delete Blog</h2>

            <form method="POST"
                  action="{% url 'blog_delete' blog.pk %}"
                  onsubmit="return confirm('Are you sure you want to delete this blog?');">

                {% csrf_token %}

                <button type="submit" class="delete-btn">
                    Delete Blog
                </button>
            </form>

        </div>

        <a href="{% url 'blog_list' %}" class="back-link">
            ← Back to Blog List
        </a>

    </div>

</body>
</html>
