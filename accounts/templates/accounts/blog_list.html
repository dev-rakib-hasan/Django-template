
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Blogs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101418;
            color: #e5e7eb;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        /* Header */

        .header {
            background: #1b2229;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid #303b45;
        }

        .header h2 {
            color: #f1f5f9;
            font-size: 29px;
            margin-bottom: 20px;
        }

        /* Create Button */

        .create-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #38bdf8;
            color: #101418;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
            transition: 0.3s;
        }

        .create-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        /* Blog Card */

        .blog-card {
            background: #1b2229;
            padding: 25px;
            border-radius: 11px;
            margin-bottom: 20px;
            border: 1px solid #303b45;
            transition: 0.3s;
        }

        .blog-card:hover {
            border-color: #38bdf8;
            transform: translateY(-3px);
        }

        .blog-card h3 {
            color: #7dd3fc;
            font-size: 22px;
            margin-bottom: 14px;
            overflow-wrap: anywhere;
        }

        .blog-card p {
            color: #b6c0ca;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 22px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* Buttons */

        .actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 11px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        /* View */

        .view-btn {
            background: #38bdf8;
            color: #101418;
        }

        .view-btn:hover {
            background: #7dd3fc;
        }

        /* Update */

        .update-btn {
            background: #e2e8f0;
            color: #1e293b;
        }

        .update-btn:hover {
            background: #ffffff;
        }

        /* Delete */

        .delete-btn {
            background: #334155;
            color: #fda4af;
            border: 1px solid #475569;
        }

        .delete-btn:hover {
            background: #9f1239;
            color: white;
        }

        .delete-form {
            display: inline;
        }

        /* Empty Blog */

        .empty-box {
            background: #1b2229;
            padding: 45px 20px;
            text-align: center;
            border-radius: 11px;
            border: 1px solid #303b45;
        }

        .empty-box h3 {
            color: #7dd3fc;
            margin-bottom: 12px;
        }

        .empty-box p {
            color: #9ca3af;
            margin-bottom: 22px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .header {
                padding: 22px 15px;
            }

            .header h2 {
                font-size: 24px;
            }

            .blog-card {
                padding: 20px;
            }

            .actions {
                gap: 9px;
            }

            .btn {
                padding: 10px 13px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->

        <div class="header">

            <h2>All Blogs</h2>

            <a href="{% url 'blog_create' %}" class="create-btn">
                + Create New Blog
            </a>

        </div>

        <!-- Blog List -->

        {% for blog in blogs %}

            <div class="blog-card">

                <h3>{{ blog.title }}</h3>

                <p>{{ blog.description }}</p>

                <div class="actions">

                    <a href="{% url 'blog_detail' blog.pk %}"
                       class="btn view-btn">
                        View Details
                    </a>

                    <a href="{% url 'blog_detail' blog.pk %}"
                       class="btn update-btn">
                        Update
                    </a>

                    <form method="POST"
                          action="{% url 'blog_delete' blog.pk %}"
                          class="delete-form"
                          onsubmit="return confirm('Are you sure you want to delete this blog?');">

                        {% csrf_token %}

                        <button type="submit" class="btn delete-btn">
                            Delete
                        </button>

                    </form>

                </div>

            </div>

        {% empty %}

            <div class="empty-box">

                <h3>No Blogs Found!</h3>

                <p>You haven't created any blog yet.</p>

                <a href="{% url 'blog_create' %}" class="create-btn">
                    + Create Your First Blog
                </a>

            </div>

        {% endfor %}

    </div>

</body>
</html>
